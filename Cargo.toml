[package]
name = "vilnius-evacuation"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Offline Vilnius evacuation simulation"

[dependencies]
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
strip = "symbols"
