name: Windows package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Create a public prerelease for the version in Cargo.toml
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: "-C target-feature=+crt-static"
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - run: cargo +stable test --locked --target x86_64-pc-windows-msvc
      - run: cargo +stable build --release --locked --target x86_64-pc-windows-msvc
      - name: Package the portable app
        run: python tools/package.py target/x86_64-pc-windows-msvc/release/vilnius-evacuation.exe x86_64-pc-windows-msvc vilnius-evacuation-windows-x64.zip
      - id: version
        shell: pwsh
        run: |
          $package = (cargo +stable metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0]
          "tag=v$($package.version)" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: windows-x64-zip
          path: vilnius-evacuation-windows-x64.zip
          if-no-files-found: error

  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref_name == 'main' && inputs.publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: windows-x64-zip
      - name: Publish the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" vilnius-evacuation-windows-x64.zip \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Vilnius evacuation $RELEASE_TAG" \
            --notes "Portable Windows x64 build. Extract the ZIP and open VilniusEvacuation.exe."
